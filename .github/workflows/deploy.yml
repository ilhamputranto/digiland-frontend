name: Build and Deploy to cPanel

on:
  push:
    branches: [main]
  # Supaya bisa di-trigger manual juga dari tab "Actions" di GitHub kalau perlu
  workflow_dispatch:
  # Dipicu dari luar GitHub - ini yang dipanggil WordPress lewat webhook
  # tiap ada post/page/kategori yang berubah, supaya situs auto-rebuild.
  repository_dispatch:
    types: [wordpress-content-update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro (fetch data dari WordPress production)
        run: npm run build
        env:
          WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}

      - name: Deploy ke cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          # Jangan hapus file yang tidak ada di dist/ - beberapa hosting
          # menaruh file sistem (cgi-bin, dll) di root yang tidak boleh
          # ikut terhapus. Kalau yakin public_html cuma isi Astro, boleh
          # dihapus baris exclude ini.
          exclude: |
            **/.git*
            **/.git*/**
            **/cgi-bin/**